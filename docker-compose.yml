services:
  db:
    image: postgres:16-alpine
    container_name: homestay-db
    environment:
      POSTGRES_USER: homestay
      POSTGRES_PASSWORD: homestay
      POSTGRES_DB: homestay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homestay -d homestay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
